<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Submissions — RichMadeIt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --black:#000; --panel:#141216; --panel-2:#1c1920; --line:#2e2932;
  --gold:#d4af5a; --paper:#f2efe8; --muted:#8f8a94;
  --alert:#e2574c; --ok:#5ec27a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--black);color:var(--paper);
  font-family:'Barlow',system-ui,sans-serif;font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;padding:0 20px 70px}
.wrap{max-width:760px;margin:0 auto}

/* login */
.login{max-width:360px;margin:0 auto;padding:90px 0}
.login h1{font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;
  font-size:32px;margin:0 0 4px;line-height:1}
.login .rule{height:4px;background:var(--gold);margin:16px 0 26px}
label{display:block;font-size:14px;color:var(--muted);margin:0 0 6px}
input[type=email],input[type=password]{width:100%;background:var(--panel);color:var(--paper);
  border:1px solid var(--line);border-radius:3px;padding:13px 14px;font-family:inherit;font-size:16.5px}
input:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-color:transparent}
input.pin{font-family:ui-monospace,Menlo,monospace;font-size:26px;text-align:center;letter-spacing:.35em;padding:16px 8px}
button.go{width:100%;background:var(--gold);color:#0d0b07;border:0;border-radius:3px;
  font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;font-size:17px;
  letter-spacing:.05em;padding:16px;cursor:pointer;margin-top:20px}
button.go:disabled{background:var(--panel-2);color:#5a5560;cursor:not-allowed}
.err{color:var(--alert);font-size:14.5px;margin-top:14px;min-height:1.3em}

/* header */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:40px 0 0}
.top h1{font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;font-size:28px;margin:0}
.top button{background:none;border:0;color:var(--muted);cursor:pointer;font-family:inherit;font-size:14.5px;padding:4px}
.top button:hover{color:var(--paper)}
.rulebar{height:4px;background:var(--gold);margin:14px 0 22px}

.filters{display:flex;gap:8px;margin-bottom:24px}
.filters button{background:var(--panel);border:1px solid var(--line);color:var(--muted);
  border-radius:3px;padding:9px 16px;font-family:inherit;font-size:14.5px;cursor:pointer}
.filters button[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#0d0b07;font-weight:600}

.totals{display:flex;gap:26px;flex-wrap:wrap;border:1px solid var(--line);
  border-left:4px solid var(--ok);background:var(--panel);padding:14px 18px;margin-bottom:22px}
.totals div{display:flex;flex-direction:column;gap:2px}
.totals .k{color:var(--muted);font-size:12.5px;letter-spacing:.03em}
.totals .v{font-family:'Oswald',sans-serif;font-weight:600;font-size:22px;color:var(--ok)}
.state{color:var(--muted);padding:30px 0}

/* card */
.card{border:1px solid var(--line);border-left:4px solid var(--gold);background:var(--panel);
  margin-bottom:18px;padding:18px}
.acts button.copy{border-color:var(--gold);color:var(--gold)}
.acts button.copy.done{border-color:var(--ok);color:var(--ok)}
.acts button.dl{border-color:var(--gold);color:var(--gold)}

/* payment block */
.pay{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.payhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.toggle-pay{display:flex;align-items:center;gap:9px;cursor:pointer;
  background:var(--panel-2);border:1px solid var(--line);border-radius:3px;
  padding:10px 15px;font-family:inherit;font-size:14.5px;color:var(--paper)}
.toggle-pay:hover{border-color:var(--gold)}
.toggle-pay.on{background:rgba(94,194,122,.12);border-color:var(--ok);color:var(--ok)}
.toggle-pay .dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.toggle-pay.on .dot{background:var(--ok)}
.paidwhen{color:var(--muted);font-size:13.5px}
.paidwhen b{color:var(--paper);font-weight:500}
.secs{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.secs label{margin:0;font-size:14px;color:var(--muted)}
.secs input{width:88px;background:var(--panel-2);color:var(--paper);
  border:1px solid var(--line);border-radius:3px;padding:9px 11px;
  font-family:ui-monospace,Menlo,monospace;font-size:16px;text-align:center}
.secs input:focus{outline:2px solid var(--gold);outline-offset:2px;border-color:transparent}
.secs .worth{font-family:'Oswald',sans-serif;font-weight:500;color:var(--gold);font-size:17px}
.secs .saved{color:var(--ok);font-size:13.5px;opacity:0;transition:opacity .2s}
.secs .saved.show{opacity:1}
.card.paid{border-left-color:var(--ok)}

.card.done{border-left-color:var(--line);opacity:.62}
.chead{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap}
.ref{font-family:ui-monospace,Menlo,monospace;font-size:17px;color:var(--gold);letter-spacing:.07em}
.when{color:var(--muted);font-size:13.5px}
.who{font-family:'Oswald',sans-serif;font-weight:500;font-size:21px;margin:8px 0 2px}
.who span{color:var(--muted);font-family:'Barlow',sans-serif;font-weight:400;font-size:15px}
.contact{color:var(--muted);font-size:15px;word-break:break-word}
.delivery{display:grid;gap:8px;margin:10px 0 2px}
.delivery-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--panel-2);border:1px solid var(--line);padding:9px 11px;border-radius:3px}
.delivery-row .dk{color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;min-width:58px}
.delivery-row .dv{color:var(--paper);font-size:14.5px;text-align:right;word-break:break-word}
.delivery-row.primary{border-left:3px solid var(--gold)}
.delivery-row a{color:var(--gold);text-decoration:none}
.delivery-row a:hover{text-decoration:underline}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.quick a,.quick button{background:var(--panel-2);border:1px solid var(--gold);color:var(--gold);
  border-radius:3px;padding:8px 12px;font-family:inherit;font-size:13.5px;cursor:pointer;text-decoration:none}
.quick a:hover,.quick button:hover{background:rgba(212,175,90,.08)}

.window{display:inline-block;font-family:ui-monospace,Menlo,monospace;font-size:15px;
  background:var(--panel-2);border:1px solid var(--line);padding:7px 12px;margin:13px 0 4px;letter-spacing:.04em}
.window b{color:var(--gold);font-weight:400}

.stylechip{display:inline-block;font-family:'Oswald',sans-serif;font-weight:500;
  font-size:13px;letter-spacing:.06em;text-transform:uppercase;
  background:rgba(212,175,90,.13);border:1px solid var(--gold);color:var(--gold);
  padding:5px 11px;border-radius:3px;margin:13px 8px 0 0;vertical-align:middle}
.stylechip.none{background:none;border-color:var(--line);color:var(--muted)}
.shots{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.shots a{display:block;width:82px;height:82px;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.shots img{width:100%;height:100%;object-fit:cover;display:block}
audio{width:100%;margin-top:14px;display:block}
.songlink{display:inline-block;margin-top:13px;color:var(--gold);font-size:15px;word-break:break-all}

.acts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.acts button,.acts a{background:var(--panel-2);border:1px solid var(--line);color:var(--paper);
  border-radius:3px;padding:10px 16px;font-family:inherit;font-size:14.5px;cursor:pointer;
  text-decoration:none;display:inline-block}
.acts button:hover,.acts a:hover{border-color:var(--gold)}
.acts button.mark{border-color:var(--ok);color:var(--ok)}
</style>
</head>
<body>

<div class="wrap">

  <section class="login" id="login">
    <h1>Submissions</h1>
    <div class="rule"></div>
    <label for="pw">Enter your code</label>
    <input type="password" id="pw" inputmode="numeric" autocomplete="current-password"
           maxlength="12" class="pin">
    <button class="go" id="signin">Open</button>
    <div class="err" id="lerr"></div>
  </section>

  <main id="app" hidden>
    <div class="top">
      <h1>Submissions</h1>
      <button id="out">Sign out</button>
    </div>

    <div class="state" id="state">Loading…</div>

<script>

/* ---------- auth ---------- */
$("signin").onclick = async () => {

/* ---------- filters ---------- */

$("fPaid").onclick = () => { filter = "paid"; flip(); };
$("fAll").onclick = () => { filter = "all"; flip(); };
function flip() {

}

/* ---------- helpers ---------- */
const esc = s => (s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ago = iso => {
  const m = Math.floor((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return m + " min ago";
  const h = Math.floor(m / 60);
  if (h < 24) return h + (h === 1 ? " hour ago" : " hours ago");
  const d = Math.floor(h / 24);
  return d + (d === 1 ? " day ago" : " days ago");
};
const toSec = v => { const m = (v || "").match(/^(\d{1,2}):([0-5]\d)$/); return m ? +m[1] * 60 + +m[2] : null; };
const styleName = s => ({ realistic: "Realistic", anime: "Anime", gta: "Game style" })[s] || "No style picked";

const parseContact = raw => {
  const out = { email:"", socialPlatform:"", social:"", phone:"", legacy:"" };
  const s = (raw || "").trim();
  if (!s) return out;

  // New format from the preview page:
  // Email: x | Social: TikTok @name | Phone: 555...
  if (s.includes("Email:") || s.includes("Social:") || s.includes("Phone:")) {
    s.split("|").map(x => x.trim()).forEach(part => {
      let m;
      if ((m = part.match(/^Email:\s*(.+)$/i))) out.email = m[1].trim();
      else if ((m = part.match(/^Phone:\s*(.+)$/i))) out.phone = m[1].trim();
      else if ((m = part.match(/^Social:\s*(.*)$/i))) {
        const rest = m[1].trim();
        const sm = rest.match(/^(TikTok|Instagram|Facebook|Other)\s+(.+)$/i);
        if (sm) {
          out.socialPlatform = sm[1];
          out.social = sm[2].trim();
        } else {
          out.social = rest;
        }
      }
    });
  } else {
    // Backward compatibility for older submissions that only stored one contact string.
    out.legacy = s;
  }
  return out;
};

const socialUrl = (platform, handle) => {
  const h = (handle || "").trim().replace(/^@/, "");
  if (!h) return "";
  const p = (platform || "").toLowerCase();
  if (p === "tiktok") return "https://www.tiktok.com/@" + encodeURIComponent(h);
  if (p === "instagram") return "https://www.instagram.com/" + encodeURIComponent(h) + "/";
  if (p === "facebook") return "https://www.facebook.com/search/top?q=" + encodeURIComponent(handle);
  return "";
};

  const rows = [];

    starterEmail.href = starterGmailUrl;
    starterEmail.target = "_blank";
    starterEmail.rel = "noopener";
    starterEmail.textContent = "Starter email";
    q.append(starterEmail);

    // PREVIEW EMAIL — send this after the preview is finished.
    const a = document.createElement("a");
    const subject = "Your RichMadeIt preview is ready — " + ref;
    const body =
      "Hey " + (artist || "there") + ",\n\n" +

      "• the clean first 15 seconds\n" +

      "After payment, reply with a screenshot and the name you sent payment from. Your full 30-second promo will be completed within 24–48 hours.\n\n" +

    const gmailUrl =
      "https://mail.google.com/mail/?" +

  }

  if (info.phone) {

      "Hey " + (artist || "there") + ", this is RichMadeIt 🎬 I got your music-video preview request (" + ref + "). " +
      "Reply YES so I know I have the right number and you still want me to make it. I won’t start until I hear back from you.";
    starterText.href = "sms:" + num + "?&body=" + encodeURIComponent(starterSms);
    starterText.textContent = "Starter text";
    q.append(starterText);

    // PREVIEW TEXT — send this after the preview is finished.
    const a = document.createElement("a");
    const previewSms =
      "Your RichMadeIt preview is ready 🎬\n\n" +

const signed = async path => {
  const { data } = await sb.storage.from(BUCKET).createSignedUrl(path, 3600);
  return data ? data.signedUrl : null;
};

/* ---------- load ---------- */
async function load() {
  $("list").innerHTML = "";
  $("state").textContent = "Loading…";
  let q = sb.from("submissions").select("*").limit(60);
  if (filter === "paid") {
    q = q.not("paid_at", "is", null).order("paid_at", { ascending: false });
  } else {
    if (filter === "new") q = q.eq("status", "new");
    q = q.order("created_at", { ascending: false });
  }
  const { data, error } = await q;

  if (error) {
    $("state").textContent = "Couldn't load. Check that the admin policies are in place.";
    console.error(error); return;
  }
  if (!data.length) {
    $("totals").hidden = true;
    $("state").textContent =
      filter === "new" ? "Nothing new right now." :
      filter === "paid" ? "Nobody has paid yet." : "Nothing here yet.";
    return;
  }
  $("state").textContent = "";

  if (filter === "paid") {
    const secs = data.reduce((t, r) => t + (r.seconds_paid || 0), 0);
    const missing = data.filter(r => !r.seconds_paid).length;
    $("totals").innerHTML =
      '<div><span class="k">Paid</span><span class="v">' + data.length + '</span></div>' +
      '<div><span class="k">Seconds owed</span><span class="v">' + secs + '</span></div>' +
      '<div><span class="k">Value</span><span class="v">$' + secs + '</span></div>' +
      (missing ? '<div><span class="k">Missing seconds</span><span class="v">' + missing + '</span></div>' : '');
    $("totals").hidden = false;
  } else {
    $("totals").hidden = true;
  }
  for (const row of data) $("list").append(await card(row));
}

/* ---------- one submission ---------- */
async function card(r) {
  const el = document.createElement("article");
  el.className = "card" + (r.status === "done" ? " done" : "") + (r.paid_at ? " paid" : "");

  const a = toSec(r.start_time), b = toSec(r.end_time);
  const len = (a !== null && b !== null) ? (b - a) + " seconds" : "";
  const contactInfo = parseContact(r.contact);

  el.innerHTML = `
    <div class="chead">
      <span class="ref">${esc(r.ref)}</span>
      <span class="when">${ago(r.created_at)}</span>
    </div>
    <div class="who">${esc(r.artist_name) || "<span>No name given</span>"}</div>
    <div class="contact delivery"></div>
    <div class="window"><b>${esc(r.start_time)}</b> to <b>${esc(r.end_time)}</b>${len ? " · " + len : ""}</div>
    <span class="stylechip${r.style ? "" : " none"}">${styleName(r.style)}</span>
    <div class="shots"></div>
    <div class="audio"></div>
    <div class="acts"></div>
    <div class="pay">
      <div class="payhead">
        <button type="button" class="toggle-pay"><span class="dot"></span><span class="lbl">Mark as paid</span></button>
        <span class="paidwhen"></span>
      </div>
      <div class="secs" hidden>
        <label>Seconds paid for</label>
        <input type="text" inputmode="numeric" class="secin" placeholder="30">
        <span class="worth"></span>
        <span class="saved">Saved</span>
      </div>
    </div>`;

  renderDelivery(el.querySelector(".delivery"), contactInfo, r.ref, r.artist_name);

  // photos
  const shots = el.querySelector(".shots");
  for (const p of (r.photo_paths || [])) {
    const url = await signed(p);
    if (!url) continue;
    const link = document.createElement("a");
    link.href = url; link.target = "_blank"; link.rel = "noopener";
    const img = document.createElement("img"); img.src = url; img.alt = "";
    link.append(img); shots.append(link);
  }

  // song
  const au = el.querySelector(".audio");
  if (r.song_path) {
    const url = await signed(r.song_path);
    if (url) {
      const p = document.createElement("audio");
      p.controls = true; p.preload = "none"; p.src = url;
      au.append(p);
      const dl = document.createElement("a");
      dl.href = url; dl.download = ""; dl.textContent = "Download the song";
      el.querySelector(".acts").append(dl);
    }
  } else if (r.song_url) {
    const link = document.createElement("a");
    link.className = "songlink"; link.href = r.song_url;
    link.target = "_blank"; link.rel = "noopener";
    link.textContent = r.song_url;
    au.append(link);
  }

  // ---- copy brief + download all ----
  const acts = el.querySelector(".acts");

  const photoUrls = Array.from(shots.querySelectorAll("a")).map(a => a.href);
  const songUrl = (el.querySelector("audio") || {}).src || null;

  const copyBtn = document.createElement("button");
  copyBtn.type = "button";
  copyBtn.className = "copy";
  copyBtn.textContent = "Copy brief";
  const briefText = () => {
    const lines = [
      "REF: " + r.ref,
      "ARTIST: " + (r.artist_name || "not given"),
      contactInfo.email ? "EMAIL: " + contactInfo.email : "",
      contactInfo.social ? "SOCIAL: " + (contactInfo.socialPlatform ? contactInfo.socialPlatform + " " : "") + contactInfo.social : "",
      contactInfo.phone ? "PHONE: " + contactInfo.phone : "",
      contactInfo.legacy ? "CONTACT: " + contactInfo.legacy : "",
      "STYLE: " + styleName(r.style),
      "WINDOW: " + (r.start_time || "?") + " to " + (r.end_time || "?") +
        (len ? "  (" + len + ")" : ""),
      "PHOTOS: " + photoUrls.length,
      r.song_url ? "SONG LINK: " + r.song_url : "SONG: uploaded file",
      r.seconds_paid ? "PAID FOR: " + r.seconds_paid + " seconds ($" + r.seconds_paid + ")" : "",
      "",
      "Cut " + (r.start_time || "?") + " to " + (r.end_time || "?") +
        " and build the seven-cut prompt in " + styleName(r.style).toLowerCase() + "."
    ].filter(Boolean);
    return lines.join("\n");
  };

  copyBtn.onclick = async () => {
    try {
      await navigator.clipboard.writeText(briefText());
      copyBtn.textContent = "Copied";
      copyBtn.classList.add("done");
      setTimeout(() => { copyBtn.textContent = "Copy brief"; copyBtn.classList.remove("done"); }, 1800);
    } catch (e) {
      copyBtn.textContent = "Couldn't copy";
      console.error(e);
    }
  };
  acts.append(copyBtn);

  if (photoUrls.length || songUrl) {
    const dlBtn = document.createElement("button");
    dlBtn.type = "button";
    dlBtn.className = "dl";
    dlBtn.textContent = "Download folder";
    dlBtn.onclick = async () => {
      dlBtn.disabled = true;
      dlBtn.textContent = "Packing";
      try {
        const zip = new JSZip();
        const folder = zip.folder(r.ref);
        folder.file("BRIEF.txt", briefText());

        const ext = (path, fallback) => {
          const m = (path || "").match(/\.([a-zA-Z0-9]{2,5})(?:\?|$)/);
          return m ? m[1].toLowerCase() : fallback;
        };

        for (let i = 0; i < photoUrls.length; i++) {
          dlBtn.textContent = "Packing photo " + (i + 1);
          const blob = await (await fetch(photoUrls[i])).blob();
          const e = ext((r.photo_paths || [])[i], "jpg");
          folder.file("photo_" + (i + 1) + "." + e, blob);
        }

        if (songUrl) {
          dlBtn.textContent = "Packing song";
          const blob = await (await fetch(songUrl)).blob();
          folder.file("song." + ext(r.song_path, "mp3"), blob);
        }

        dlBtn.textContent = "Zipping";
        const out = await zip.generateAsync({ type: "blob" });
        const url = URL.createObjectURL(out);
        const a = document.createElement("a");
        a.href = url;
        a.download = r.ref + ".zip";
        document.body.append(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
      } catch (e) {
        console.error(e);
        dlBtn.textContent = "Didn't pack";
        setTimeout(() => { dlBtn.textContent = "Download folder"; }, 2200);
        dlBtn.disabled = false;
        return;
      }
      dlBtn.disabled = false;
      dlBtn.textContent = "Download folder";
    };
    acts.append(dlBtn);
  }

  const mark = document.createElement("button");
  const setLabel = () => {
    mark.textContent = r.status === "done" ? "Put it back" : "Mark it done";
    mark.className = r.status === "done" ? "" : "mark";
  };
  setLabel();
  mark.onclick = async () => {
    const next = r.status === "done" ? "new" : "done";
    mark.disabled = true;
    const { error } = await sb.from("submissions").update({ status: next }).eq("id", r.id);
    mark.disabled = false;
    if (error) { mark.textContent = "Didn't save"; console.error(error); return; }
    r.status = next; setLabel();
    el.classList.toggle("done", next === "done");
    if (filter === "new" && next === "done") el.remove();
  };
  acts.append(mark);

  // ---- paid toggle + seconds ----
  const payBtn = el.querySelector(".toggle-pay");
  const payWhen = el.querySelector(".paidwhen");
  const secsRow = el.querySelector(".secs");
  const secIn = el.querySelector(".secin");
  const worth = el.querySelector(".worth");
  const saved = el.querySelector(".saved");

  const stamp = iso => {
    const d = new Date(iso);
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) +
           " at " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  };
  const showWorth = () => {
    const n = parseInt(secIn.value, 10);
    worth.textContent = n > 0 ? "$" + n : "";
  };
  const paintPay = () => {
    const on = !!r.paid_at;
    payBtn.classList.toggle("on", on);
    payBtn.querySelector(".lbl").textContent = on ? "Paid" : "Mark as paid";
    payWhen.innerHTML = on ? "Paid <b>" + stamp(r.paid_at) + "</b>" : "";
    secsRow.hidden = !on;
    el.classList.toggle("paid", on);
  };
  secIn.value = r.seconds_paid || "";
  showWorth();
  paintPay();

  payBtn.onclick = async () => {
    const next = r.paid_at ? null : new Date().toISOString();
    payBtn.disabled = true;
    const { error } = await sb.from("submissions")
      .update({ paid_at: next }).eq("id", r.id);
    payBtn.disabled = false;
    if (error) { payWhen.textContent = "Didn't save"; console.error(error); return; }
    r.paid_at = next;
    paintPay();
    if (filter === "paid" && !next) { el.remove(); load(); }
  };

  let secTimer = null;
  secIn.addEventListener("input", () => {
    secIn.value = secIn.value.replace(/\D/g, "").slice(0, 4);
    showWorth();
    saved.classList.remove("show");
    clearTimeout(secTimer);
    secTimer = setTimeout(async () => {
      const n = parseInt(secIn.value, 10);
      const { error } = await sb.from("submissions")
        .update({ seconds_paid: isNaN(n) ? null : n }).eq("id", r.id);
      if (error) { console.error(error); return; }
      r.seconds_paid = isNaN(n) ? null : n;
      saved.classList.add("show");
      setTimeout(() => saved.classList.remove("show"), 1600);
    }, 600);
  });

  return el;
}

/* ---------- boot ---------- */
sb.auth.getSession().then(({ data }) => { if (data.session) show(); });
</script>
</body>
</html>
