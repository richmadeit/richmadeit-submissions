[build]
  publish = "."
  command = "node scripts/build-downloads.cjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."generate-reference"]
  timeout = 26

[[headers]]
  for = "/university/downloads/Three-Singer-Method-Free-Project.zip"
  [headers.values]
    Content-Type = "application/zip"
    Content-Disposition = "attachment; filename=\"Three-Singer-Method-Free-Project.zip\""
